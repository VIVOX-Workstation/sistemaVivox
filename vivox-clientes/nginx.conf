server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Arquivos gerados pelo build (JS, CSS, imagens com hash no nome).
    # Se o arquivo não existir, responde 404 de verdade. Antes caía no index.html
    # com status 200 e o Cloudflare guardava esse HTML como se fosse o JS, o que
    # deixava a tela em branco para quem usa o navegador.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html nunca deve ficar em cache: é ele que aponta para os arquivos novos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
