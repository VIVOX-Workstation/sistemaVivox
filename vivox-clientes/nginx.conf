# O TLS termina no proxy do Coolify; preservar HTTPS nos metadados públicos.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name localhost;

    # Metadados no HTML inicial: robôs de prévia não executam o React.
    # A capa é a mesma imagem usada no documento, publicada em JPEG.
    location ~ "^/proposta/[a-f0-9]{64}/?$" {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        sub_filter_once on;
        sub_filter '<title>VIVOX Flow</title>' '<title>Proposta comercial | VIVOX</title><meta property="og:type" content="website"><meta property="og:site_name" content="VIVOX"><meta property="og:locale" content="pt_BR"><meta property="og:title" content="Proposta comercial | VIVOX"><meta property="og:description" content="Confira sua proposta comercial preparada pela VIVOX."><meta property="og:url" content="$public_scheme://$host$uri"><meta property="og:image" content="$public_scheme://$http_host/proposta-capa.jpg"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="1920"><meta property="og:image:height" content="1080"><meta property="og:image:alt" content="Capa da proposta comercial VIVOX"><meta name="twitter:card" content="summary_large_image">';
    }

    # O mime.types do nginx:alpine não conhece .mjs; o worker do pdf.js (proposta em PDF)
    # é módulo e o navegador recusa módulo servido como octet-stream.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        types { }
        default_type application/javascript;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
