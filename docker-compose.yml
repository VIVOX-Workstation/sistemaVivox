services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivox-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
    depends_on:
      - postgres
      - redis
      - minio
    command: npm run start:dev

  postgres:
    image: pgvector/pgvector:pg16
    container_name: vivox-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vivox
      POSTGRES_PASSWORD: vivox
      POSTGRES_DB: vivox
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vivox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: vivox-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: vivox
      MINIO_ROOT_PASSWORD: vivox12345
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: vivox-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 vivox vivox12345;
      mc mb -p local/vivox-media;
      mc anonymous set download local/vivox-media;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
