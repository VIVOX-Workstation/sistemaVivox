## Penpot Docker Compose para Teste Local Sistema Vivox
x-flags: &penpot-flags
  PENPOT_FLAGS: disable-email-verification enable-prepl-server disable-secure-session-cookies allow-iframe allow-embed enable-login-with-password enable-registration demo-users

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: http://localhost:9005

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: vivox-secret-key-penpot-local-test-2026

networks:
  penpot_net:

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-frontend:
    image: "penpotapp/frontend:2.16"
    container_name: vivox-penpot-frontend
    restart: always
    ports:
      - "9005:8080"
    volumes:
      - penpot_assets:/opt/data/assets
      - ./penpot-config/nginx-security-headers.conf:/etc/nginx/nginx-security-headers.conf:ro
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - penpot_net
    environment:
      << : [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]

  penpot-backend:
    image: "penpotapp/backend:2.16"
    container_name: vivox-penpot-backend
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot_net
    environment:
      << : [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key]
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"

  penpot-exporter:
    image: "penpotapp/exporter:2.16"
    container_name: vivox-penpot-exporter
    restart: always
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot_net
    environment:
      << : [*penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: "postgres:15-alpine"
    container_name: vivox-penpot-postgres
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks:
      - penpot_net
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot

  penpot-valkey:
    image: valkey/valkey:8.1-alpine
    container_name: vivox-penpot-valkey
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot_net
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
